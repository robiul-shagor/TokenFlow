[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Deploy script writes the deployment manifest (deployments/<chainId>.json) here.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

# Public test networks. RPC URLs and the explorer key come from your shell env, never from committed files.
[rpc_endpoints]
local = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"
base-sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Etherscan API v2: one key verifies on every supported chain.
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base-sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
