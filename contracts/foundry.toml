[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# Deploy script writes the local-only deployment manifest here.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120
